# The hello-world job: one serverless notebook task that installs your arxiv_curator wheel,
# loads project_config.yml and writes one row to the hello table in your course schema.
# It runs as whoever deploys the bundle; your deploy principal does that from GitHub Actions.
resources:
  jobs:
    hello:
      name: job-hello-victor-bot-2
      budget_policy_id: "30ececf2-c550-38b3-9b3c-c46059666a89"
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: hello
          environment_key: default
          notebook_task:
            notebook_path: deployment_notebooks/hello.py
            base_parameters:
              env: ${bundle.target}

      permissions:
        - level: CAN_MANAGE
          user_name: "victor-bot-2@cauchy.io"
